<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Эволюция в Джунглях: Меню и Игра</title>
    <style>
        body {
            margin: 0;
            background-color: #050c05;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        canvas {
            border: 4px solid #28401e;
            box-shadow: 0 0 35px rgba(20, 45, 15, 0.9);
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const WORLD_WIDTH = 3500;
    const WORLD_HEIGHT = 3000;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    const bgCanvas = document.createElement("canvas");
    bgCanvas.width = 500;
    bgCanvas.height = 500;
    const bgCtx = bgCanvas.getContext("2d");
    bgCtx.fillStyle = "#112211";
    bgCtx.fillRect(0, 0, 500, 500);
    for (let i = 0; i < 400; i++) {
        bgCtx.fillStyle = Math.random() > 0.5 ? "#192e16" : "#0d1a0b";
        bgCtx.beginPath();
        let bx = Math.random() * 500;
        let by = Math.random() * 500;
        let br = Math.random() * 15 + 5;
        bgCtx.arc(bx, by, br, 0, Math.PI * 2);
        bgCtx.fill();
    }
    const worldPattern = ctx.createPattern(bgCanvas, "repeat");

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playSound(type) {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === "eat") {
                osc.type = "sine";
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === "hurt") {
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        } catch (e) {}
    }

    let gameState = "menu";
    
    let skins = [
        { name: "Лайм", head: "#73d216", body: "#4e9a06" },
        { name: "Огонь", head: "#ff4500", body: "#cc3300" },
        { name: "Космос", head: "#00ffff", body: "#008b8b" }
    ];
    let selectedSkinIndex = 0;

    let segments = [];
    let initialSegmentsCount = 14;
    let player = { radius: 18, baseSpeed: 2.2, boostSpeed: 4.8 };
    
    let npcs = [];
    let foodParticles = [];
    
    let startTime = Date.now();
    let finalStats = { timeStr: "0:00", score: 0 };

    function triggerDeath() {
        if (gameState !== "playing") return;
        playSound("hurt");
        let survivalSec = Math.floor((Date.now() - startTime) / 1000);
        let mins = Math.floor(survivalSec / 60);
        let secs = survivalSec % 60;
        finalStats.timeStr = mins + ":" + (secs < 10 ? "0" : "") + secs;
        finalStats.score = Math.floor(player.radius);
        gameState = "gameover";
    }

    function startGame() {
        segments = [];
        for (let i = 0; i < initialSegmentsCount; i++) {
            segments.push({
                x: WORLD_WIDTH / 2 - i * 12,
                y: WORLD_HEIGHT / 2,
                angle: 0
            });
        }
        player.radius = 18;
        startTime = Date.now();
        gameState = "playing";
        
        npcs = [];
        foodParticles = [];
        for (let i = 0; i < 25; i++) spawnNPC("worm");
        for (let i = 0; i < 10; i++) spawnNPC("snake");
        for (let i = 0; i < 6; i++) spawnNPC("anaconda");
        for (let i = 0; i < 12; i++) spawnNPC("lizard");

        for (let i = 0; i < 80; i++) {
            foodParticles.push({
                x: Math.random() * WORLD_WIDTH,
                y: Math.random() * WORLD_HEIGHT,
                radius: 3.5,
                value: 0.15,
                isRest: false
            });
        }
    }

    let joystick = { active: false, identifier: null, baseX: 0, baseY: 0, currX: 0, currY: 0, maxRadius: 65 };
    let keys = {};
    let boostActive = false;
    let lastTapTime = 0;

    window.addEventListener("keydown", (e) => {
        initAudio();
        keys[e.code] = true;
        if (e.code === "ShiftLeft" || e.code === "ShiftRight") {
            boostActive = true;
        }
        if (gameState === "gameover" && (e.code === "Space" || e.code === "Enter")) {
            startGame();
        }
    });
    window.addEventListener("keyup", (e) => { 
        keys[e.code] = false; 
        if (e.code === "ShiftLeft" || e.code === "ShiftRight") {
            boostActive = false;
        }
    });

    function spawnNPC(forceType) {
        let types = ["worm", "snake", "anaconda", "lizard"];
        let type = forceType || types[Math.floor(Math.random() * types.length)];
        
        let radius, len, speed, color;
        if (type === "worm") {
            radius = Math.random() * 5 + 6;
            len = Math.floor(Math.random() * 3) + 3;
            speed = Math.random() * 0.6 + 0.7;
            color = ["#00ffcc", "#ffcc00", "#99ff33"][Math.floor(Math.random() * 3)];
        } else if (type === "lizard") {
            radius = Math.random() * 6 + 10;
            len = Math.floor(Math.random() * 3) + 3;
            speed = Math.random() * 0.6 + 1.0;
            color = "#88aa22";
        } else if (type === "snake") {
            radius = Math.random() * 8 + 14;
            len = Math.floor(Math.random() * 6) + 6;
            speed = Math.random() * 0.5 + 0.7;
            color = ["#ff3366", "#cc33ff", "#ff6600"][Math.floor(Math.random() * 3)];
        } else {
            radius = Math.random() * 12 + 24;
            len = Math.floor(Math.random() * 8) + 10;
            speed = Math.random() * 0.3 + 0.5;
            color = "#2e5a27";
        }

        let startX = Math.random() * (WORLD_WIDTH - 600) + 300;
        let startY = Math.random() * (WORLD_HEIGHT - 600) + 300;
        
        let npcSegments = [];
        for (let i = 0; i < len; i++) {
            npcSegments.push({
                x: startX - i * 10,
                y: startY,
                angle: 0
            });
        }

        npcs.push({
            segments: npcSegments,
            radius: radius,
            color: color,
            type: type,
            baseSpeed: speed,
            speed: speed,
            angle: Math.random() * Math.PI * 2,
            targetAngle: Math.random() * Math.PI * 2,
            behaviorTimer: Math.random() * 200 + 100
        });
    }

    function dropFoodFromNPC(npc) {
        for (let s of npc.segments) {
            let foodRadius = Math.max(2.5, Math.min(npc.radius * 0.25, 8));
            let foodValue = foodRadius * 0.08;
            foodParticles.push({
                x: s.x + (Math.random() - 0.5) * 12,
                y: s.y + (Math.random() - 0.5) * 12,
                radius: foodRadius,
                value: foodValue,
                isRest: true
            });
        }
    }

    let mouseWorldX = WORLD_WIDTH / 2;
    let mouseWorldY = WORLD_HEIGHT / 2;
    let isMouseDown = false;

    window.addEventListener("mousedown", (e) => {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        if (gameState === "menu") {
            if (y > canvas.height / 2 - 30 && y < canvas.height / 2 + 35) {
                if (x > canvas.width / 2 - 160 && x < canvas.width / 2 - 110) {
                    selectedSkinIndex = (selectedSkinIndex - 1 + skins.length) % skins.length;
                    return;
                }
                if (x > canvas.width / 2 + 110 && x < canvas.width / 2 + 160) {
                    selectedSkinIndex = (selectedSkinIndex + 1) % skins.length;
                    return;
                }
            }
            if (x > canvas.width / 2 - 110 && x < canvas.width / 2 + 110 && y > canvas.height / 2 + 60 && y < canvas.height / 2 + 120) {
                startGame();
                return;
            }
            if (x > canvas.width / 2 - 110 && x < canvas.width / 2 + 110 && y > canvas.height / 2 + 135 && y < canvas.height / 2 + 195) {
                gameState = "settings";
                return;
            }
        } else if (gameState === "settings") {
            if (x > canvas.width / 2 - 110 && x < canvas.width / 2 + 110 && y > canvas.height / 2 + 80 && y < canvas.height / 2 + 140) {
                gameState = "menu";
                return;
            }
        } else if (gameState === "gameover") {
            if (x > canvas.width / 2 - 110 && x < canvas.width / 2 + 110 && y > canvas.height / 2 + 45 && y < canvas.height / 2 + 105) {
                startGame();
                return;
            }
        } else if (gameState === "playing") {
            isMouseDown = true;
            updateMouseTarget(e.clientX, e.clientY);
        }
    });

    window.addEventListener("mousemove", (e) => {
        if (gameState === "playing" && isMouseDown) updateMouseTarget(e.clientX, e.clientY);
    });
    window.addEventListener("mouseup", () => { isMouseDown = false; });

    function updateMouseTarget(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        let zoom = Math.max(0.3, 1.2 - (Math.min(player.radius, 70) / 130));
        let screenX = clientX - rect.left;
        let screenY = clientY - rect.top;
        let head = segments[0];
        mouseWorldX = head.x + (screenX - canvas.width / 2) / zoom;
        mouseWorldY = head.y + (screenY - canvas.height / 2) / zoom;
    }

    window.addEventListener("touchstart", (e) => {
        initAudio();
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            const rect = canvas.getBoundingClientRect();
            let x = touch.clientX - rect.left;
            let y = touch.clientY - rect.top;

            if (gameState === "menu") {
                if (y > canvas.height / 2 - 30 && y < canvas.height / 2 + 35) {
                    if (x > canvas.width / 2 - 160 && x < canvas.width / 2 - 110) {
                        selectedSkinIndex = (selectedSkinIndex - 1 + skins.length) % skins.length;
                        return;
                    }
                    if (x > canvas.width / 2 + 110 && x < canvas.width / 2 + 160) {
                        selectedSkinIndex = (selectedSkinIndex + 1) % skins.length;
                        return;
                    }
                }
                if (x > canvas.width / 2 - 110 && x < canvas.width / 2 + 110 && y > canvas.height / 2 + 60 && y < canvas.height / 2 + 120) {
                    startGame();
                    return;
                }
                if (x > canvas.width / 2 - 110 && x < canvas.width / 2 + 110 && y > canvas.height / 2 + 135 && y < canvas.height / 2 + 195) {
                    gameState = "settings";
                    return;
                }
            } else if (gameState === "settings") {
                if (x > canvas.width / 2 - 110 && x < canvas.width / 2 + 110 && y > canvas.height / 2 + 80 && y < canvas.height / 2 + 140) {
                    gameState = "menu";
                    return;
                }
            } else if (gameState === "gameover") {
                if (x > canvas.width / 2 - 110 && x < canvas.width / 2 + 110 && y > canvas.height / 2 + 45 && y < canvas.height / 2 + 105) {
                    startGame();
                    return;
                }
            } else if (gameState === "playing") {
                if (touch.clientX > window.innerWidth / 2 && !joystick.active) {
                    let currentTime = Date.now();
                    if (currentTime - lastTapTime < 350) {
                        boostActive = true;
                    } else {
                        boostActive = false;
                    }
                    lastTapTime = currentTime;

                    joystick.active = true;
                    joystick.identifier = touch.identifier;
                    joystick.baseX = touch.clientX;
                    joystick.baseY = touch.clientY;
                    joystick.currX = touch.clientX;
                    joystick.currY = touch.clientY;
                }
            }
        }
    });

    window.addEventListener("touchmove", (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            if (touch.identifier === joystick.identifier) {
                let dx = touch.clientX - joystick.baseX;
                let dy = touch.clientY - joystick.baseY;
                let dist = Math.hypot(dx, dy);
                if (dist > joystick.maxRadius) {
                    dx = (dx / dist) * joystick.maxRadius;
                    dy = (dy / dist) * joystick.maxRadius;
                }
                joystick.currX = joystick.baseX + dx;
                joystick.currY = joystick.baseY + dy;
            }
        }
        e.preventDefault();
    }, { passive: false });

    window.addEventListener("touchend", (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            let touch = e.changedTouches[i];
            if (touch.identifier === joystick.identifier) {
                joystick.active = false;
                joystick.identifier = null;
                boostActive = false;
            }
        }
    });

    let isMoving = false;
    let boostTimer = 0;

    function update() {
        if (gameState !== "playing") return;

        let head = segments[0];
        isMoving = false;

        let currentSpeed = player.baseSpeed;
        let moveX = 0;
        let moveY = 0;

        if (keys["ArrowLeft"] || keys["KeyA"]) moveX = -1;
        if (keys["ArrowRight"] || keys["KeyD"]) moveX = 1;
        if (keys["ArrowUp"] || keys["KeyW"]) moveY = -1;
        if (keys["ArrowDown"] || keys["KeyS"]) moveY = 1;

        if (moveX !== 0 || moveY !== 0) {
            head.angle = Math.atan2(moveY, moveX);
            isMoving = true;
            currentSpeed = boostActive ? player.boostSpeed : player.baseSpeed;
        } else if (joystick.active) {
            let jDx = joystick.currX - joystick.baseX;
            let jDy = joystick.currY - joystick.baseY;
            let jDist = Math.hypot(jDx, jDy);
            if (jDist > 5) {
                head.angle = Math.atan2(jDy, jDx);
                isMoving = true;
                currentSpeed = boostActive ? player.boostSpeed : player.baseSpeed;
            }
        } else if (isMouseDown) {
            let dx = mouseWorldX - head.x;
            let dy = mouseWorldY - head.y;
            let dist = Math.hypot(dx, dy);
            if (dist > 2) {
                head.angle = Math.atan2(dy, dx);
                isMoving = true;
                currentSpeed = boostActive ? player.boostSpeed : player.baseSpeed;
            }
        }

        head.x += Math.cos(head.angle) * currentSpeed;
        head.y += Math.sin(head.angle) * currentSpeed;

        if (head.x <= 15 || head.x >= WORLD_WIDTH - 15 || head.y <= 15 || head.y >= WORLD_HEIGHT - 15) {
            triggerDeath();
            return;
        }

        if (boostActive && isMoving) {
            boostTimer++;
            if (boostTimer % 8 === 0) {
                if (player.radius > 12) {
                    player.radius -= 0.15;
                    if (segments.length > 8) segments.pop();
                    
                    let tail = segments[segments.length - 1];
                    foodParticles.push({
                        x: tail.x + (Math.random() - 0.5) * 10,
                        y: tail.y + (Math.random() - 0.5) * 10,
                        radius: 3.5,
                        value: 0.2,
                        isRest: true
                    });
                } else {
                    boostActive = false;
                }
            }
        }

        for (let i = 0; i < segments.length; i++) {
            let curr = segments[i];
            if (i === 0) {
                if (i + 1 < segments.length) {
                    let next = segments[i + 1];
                    curr.angle = Math.atan2(curr.y - next.y, curr.x - next.x);
                }
            } else {
                let prev = segments[i - 1];
                let dx = prev.x - curr.x;
                let dy = prev.y - curr.y;
                let dist = Math.hypot(dx, dy);
                let targetDist = 12;

                if (dist > targetDist) {
                    curr.x = prev.x - (dx / dist) * targetDist;
                    curr.y = prev.y - (dy / dist) * targetDist;
                }
                curr.angle = Math.atan2(prev.y - curr.y, prev.x - curr.x);
            }
        }

        for (let i = foodParticles.length - 1; i >= 0; i--) {
            let f = foodParticles[i];
            let dist = Math.hypot(head.x - f.x, head.y - f.y);
            let headR = Math.min(player.radius, 45) * 0.65;
            if (dist < headR + f.radius) {
                player.radius += f.value;
                playSound("eat");
                foodParticles.splice(i, 1);
                
                if (segments.length < 60) {
                    let last = segments[segments.length - 1];
                    segments.push({ x: last.x, y: last.y, angle: last.angle });
                }
            }
        }

        for (let i = npcs.length - 1; i >= 0; i--) {
            let npc = npcs[i];
            let nHead = npc.segments[0];

            let dangerDetected = false;
            let escapeAngle = 0;

            let distToPlayer = Math.hypot(nHead.x - head.x, nHead.y - head.y);
            if (distToPlayer < 200 && player.radius >= npc.radius * 0.9) {
                dangerDetected = true;
                escapeAngle = Math.atan2(nHead.y - head.y, nHead.x - head.x);
            }

            for (let k = 0; k < npcs.length; k++) {
                if (k === i) continue;
                let other = npcs[k];
                let distToOther = Math.hypot(nHead.x - other.segments[0].x, nHead.y - other.segments[0].y);
                if (distToOther < 160 && other.radius > npc.radius * 1.15) {
                    dangerDetected = true;
                    escapeAngle = Math.atan2(nHead.y - other.segments[0].y, nHead.x - other.segments[0].x);
                }
            }

            npc.behaviorTimer--;

            if (dangerDetected) {
                npc.targetAngle = escapeAngle;
                npc.speed = npc.baseSpeed * 1.3;
            } else if (npc.behaviorTimer <= 0) {
                npc.targetAngle = Math.random() * Math.PI * 2;
                npc.speed = npc.baseSpeed;
                npc.behaviorTimer = Math.random() * 250 + 100;
            }

            let angleDiff = Math.atan2(Math.sin(npc.targetAngle - npc.angle), Math.cos(npc.targetAngle - npc.angle));
            npc.angle += Math.max(-0.035, Math.min(0.035, angleDiff));

            let safeMargin = 250;
            if (nHead.x < safeMargin) npc.targetAngle = 0;
            if (nHead.x > WORLD_WIDTH - safeMargin) npc.targetAngle = Math.PI;
            if (nHead.y < safeMargin) npc.targetAngle = Math.PI / 2;
            if (nHead.y > WORLD_HEIGHT - safeMargin) npc.targetAngle = -Math.PI / 2;

            nHead.x += Math.cos(npc.angle) * npc.speed;
            nHead.y += Math.sin(npc.angle) * npc.speed;

            for (let j = 0; j < npc.segments.length; j++) {
                let curr = npc.segments[j];
                if (j === 0) {
                    if (j + 1 < npc.segments.length) {
                        let next = npc.segments[j + 1];
                        curr.angle = Math.atan2(curr.y - next.y, curr.x - next.x);
                    }
                } else {
                    let prev = npc.segments[j - 1];
                    let dx = prev.x - curr.x;
                    let dy = prev.y - curr.y;
                    let dist = Math.hypot(dx, dy);
                    let targetDist = 10;
                    if (dist > targetDist) {
                        curr.x = prev.x - (dx / dist) * targetDist;
                        curr.y = prev.y - (dy / dist) * targetDist;
                    }
                    curr.angle = Math.atan2(prev.y - curr.y, prev.x - curr.x);
                }
            }

            let headR = Math.min(player.radius, 45) * 0.65;
            
            let headHitNPC = false;
            for (let j = 1; j < npc.segments.length; j++) {
                let seg = npc.segments[j];
                let segR = Math.max(4, Math.min(npc.radius * (1 - j * 0.02), 32)) * 0.7;
                if (Math.hypot(head.x - seg.x, head.y - seg.y) < headR + segR) {
                    headHitNPC = true;
                    break;
                }
            }
            if (headHitNPC) {
                triggerDeath();
                return;
            }

            let playerBodyHitNPCHead = false;
            let npcHeadR = Math.max(4, Math.min(npc.radius, 32)) * 0.7;
            for (let j = 1; j < segments.length; j++) {
                let seg = segments[j];
                let segR = Math.min(player.radius, 45) * 0.65 * (1 - j * 0.012);
                if (Math.hypot(seg.x - nHead.x, seg.y - nHead.y) < segR + npcHeadR) {
                    playerBodyHitNPCHead = true;
                    break;
                }
            }
            if (playerBodyHitNPCHead) {
                player.radius += npc.radius * 0.15;
                playSound("eat");
                dropFoodFromNPC(npc);
                npcs.splice(i, 1);
                spawnNPC();
                continue;
            }

            for (let k = npcs.length - 1; k >= 0; k--) {
                if (k === i) continue;
                let other = npcs[k];
                let otherHead = other.segments[0];
                let otherHeadR = Math.max(4, Math.min(other.radius, 32)) * 0.7;

                let otherHitThisBody = false;
                for (let j = 1; j < npc.segments.length; j++) {
                    let seg = npc.segments[j];
                    let segR = Math.max(4, Math.min(npc.radius * (1 - j * 0.02), 32)) * 0.7;
                    if (Math.hypot(otherHead.x - seg.x, otherHead.y - seg.y) < otherHeadR + segR) {
                        otherHitThisBody = true;
                        break;
                    }
                }

                if (otherHitThisBody && other.radius > npc.radius * 1.1) {
                    other.radius += npc.radius * 0.1;
                    dropFoodFromNPC(npc);
                    npcs.splice(i, 1);
                    spawnNPC();
                    if (k > i) k--;
                    break;
                }
            }
        }

        if (npcs.length < 35) spawnNPC();
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gameState === "playing" || gameState === "gameover") {
            let head = segments[0];
            let zoom = Math.max(0.3, 1.2 - (Math.min(player.radius, 70) / 130));

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.scale(zoom, zoom);
            ctx.translate(-head.x, -head.y);

            ctx.fillStyle = worldPattern;
            ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            ctx.strokeStyle = "#ff3366";
            ctx.lineWidth = 10;
            ctx.strokeRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

            for (let f of foodParticles) {
                ctx.fillStyle = f.isRest ? "#ffffff" : "#ffcc00";
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.radius, 0, Math.PI * 2);
                ctx.fill();
            }

            for (let npc of npcs) {
                for (let j = npc.segments.length - 1; j >= 0; j--) {
                    let seg = npc.segments[j];
                    ctx.save();
                    ctx.translate(seg.x, seg.y);
                    ctx.rotate(seg.angle);

                    let currentRadius = Math.max(4, Math.min(npc.radius * (1 - j * 0.02), 32));

                    ctx.fillStyle = npc.type === "anaconda" ? (j % 2 === 0 ? "#2e5a27" : "#1b3817") : npc.color;
                    ctx.strokeStyle = "#ffffff";
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    if (j === 0) {
                        let eyeOffset = currentRadius * 0.4;
                        let eyeSize = Math.max(2, currentRadius * 0.22);
                        
                        ctx.fillStyle = "black";
                        ctx.beginPath();
                        ctx.arc(eyeOffset, -eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.arc(eyeOffset, eyeOffset, eyeSize, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = "white";
                        ctx.beginPath();
                        ctx.arc(eyeOffset + eyeSize * 0.3, -eyeOffset - eyeSize * 0.3, eyeSize * 0.35, 0, Math.PI * 2);
                        ctx.arc(eyeOffset + eyeSize * 0.3, eyeOffset - eyeSize * 0.3, eyeSize * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            let activeSkin = skins[selectedSkinIndex];
            for (let i = segments.length - 1; i >= 0; i--) {
                let seg = segments[i];
                ctx.save();
                ctx.translate(seg.x, seg.y);
                ctx.rotate(seg.angle);

                let effectiveRadius = Math.min(player.radius, 45);
                let currentRadius = Math.max(5, effectiveRadius * 0.65 * (1 - i * 0.012));

                ctx.fillStyle = i === 0 ? activeSkin.head : activeSkin.body;
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, currentRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                if (i === 0) {
                    let pEyeOffset = currentRadius * 0.45;
                    let pEyeSize = Math.max(2.5, currentRadius * 0.22);

                    ctx.fillStyle = "black";
                    ctx.beginPath();
                    ctx.arc(pEyeOffset, -pEyeOffset, pEyeSize, 0, Math.PI * 2);
                    ctx.arc(pEyeOffset, pEyeOffset, pEyeSize, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = "white";
                    ctx.beginPath();
                    ctx.arc(pEyeOffset + pEyeSize * 0.3, -pEyeOffset - pEyeSize * 0.3, pEyeSize * 0.35, 0, Math.PI * 2);
                    ctx.arc(pEyeOffset + pEyeSize * 0.3, pEyeOffset - pEyeSize * 0.3, pEyeSize * 0.35, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            ctx.restore();

            if (gameState === "playing") {
                let survivalSec = Math.floor((Date.now() - startTime) / 1000);
                let mins = Math.floor(survivalSec / 60);
                let secs = survivalSec % 60;
                let timeStr = mins + ":" + (secs < 10 ? "0" : "") + secs;

                ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
                ctx.fillRect(15, 15, 300, 75);
                ctx.fillStyle = "white";
                ctx.font = "bold 18px Arial";
                ctx.fillText("Размер ящерки: " + Math.floor(player.radius), 30, 42);
                ctx.fillText("Время выживания: " + timeStr, 30, 72);
            }

            if (joystick.active && gameState === "playing") {
                ctx.save();
                ctx.beginPath();
                ctx.arc(joystick.baseX, joystick.baseY, joystick.maxRadius, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255, 255, 255, 0.15)";
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(joystick.currX, joystick.currY, 25, 0, Math.PI * 2);
                ctx.fillStyle = boostActive ? "rgba(255, 50, 50, 0.7)" : "rgba(115, 210, 22, 0.6)";
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.stroke();
                ctx.restore();
            }
        }

        if (gameState === "menu") {
            ctx.fillStyle = "rgba(5, 12, 5, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#73d216";
            ctx.font = "bold 46px Arial";
            ctx.textAlign = "center";
            ctx.fillText("ЭВОЛЮЦИЯ В ДЖУНГЛЯХ", canvas.width / 2, canvas.height / 2 - 130);

            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Выберите скин:", canvas.width / 2, canvas.height / 2 - 50);

            ctx.fillStyle = "#28401e";
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - 160, canvas.height / 2 - 30, 320, 65, 12);
            ctx.fill();
            ctx.strokeStyle = "#73d216";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 22px Arial";
            ctx.fillText("<  " + skins[selectedSkinIndex].name + "  >", canvas.width / 2, canvas.height / 2 + 10);

            ctx.fillStyle = "#73d216";
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - 110, canvas.height / 2 + 60, 220, 60, 10);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "white";
            ctx.font = "bold 22px Arial";
            ctx.fillText("ИГРАТЬ", canvas.width / 2, canvas.height / 2 + 97);

            ctx.fillStyle = "#334433";
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - 110, canvas.height / 2 + 135, 220, 60, 10);
            ctx.fill();
            ctx.strokeStyle = "#888888";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "#cccccc";
            ctx.font = "bold 20px Arial";
            ctx.fillText("НАСТРОЙКИ", canvas.width / 2, canvas.height / 2 + 172);
        }

        if (gameState === "settings") {
            ctx.fillStyle = "rgba(5, 12, 5, 0.95)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 38px Arial";
            ctx.textAlign = "center";
            ctx.fillText("НАСТРОЙКИ", canvas.width / 2, canvas.height / 2 - 80);

            ctx.fillStyle = "#aaaaaa";
            ctx.font = "18px Arial";
            ctx.fillText("Скоро здесь появятся параметры звука и графики!", canvas.width / 2, canvas.height / 2 - 20);

            ctx.fillStyle = "#555555";
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - 110, canvas.height / 2 + 80, 220, 60, 10);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "white";
            ctx.font = "bold 20px Arial";
            ctx.fillText("НАЗАД", canvas.width / 2, canvas.height / 2 + 117);
        }

        if (gameState === "gameover") {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#ff3366";
            ctx.font = "bold 42px Arial";
            ctx.textAlign = "center";
            ctx.fillText("ВЫ ВРЕЗАЛИСЬ ГОЛОВОЙ!", canvas.width / 2, canvas.height / 2 - 90);

            ctx.fillStyle = "white";
            ctx.font = "24px Arial";
            ctx.fillText("Время выживания: " + finalStats.timeStr, canvas.width / 2, canvas.height / 2 - 35);
            ctx.fillText("Финальный размер: " + finalStats.score, canvas.width / 2, canvas.height / 2 + 5);

            ctx.fillStyle = "#73d216";
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - 110, canvas.height / 2 + 45, 220, 60, 10);
            ctx.fill();
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = "white";
            ctx.font = "bold 20px Arial";
            ctx.fillText("ИГРАТЬ СНОВА", canvas.width / 2, canvas.height / 2 + 82);
            
            ctx.font = "14px Arial";
            ctx.fillStyle = "#dddddd";
            ctx.fillText("(или нажмите Пробел / Enter)", canvas.width / 2, canvas.height / 2 + 130);
        }
        ctx.textAlign = "left";
    }

    function loop() {
        update();
        draw();
        requestAnimationFrame(loop);
    }

    loop();
</script>

</body>
</html>
